name: Palsum checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Firebase access rules and account upgrades
        run: npx --yes firebase-tools emulators:exec --only auth,firestore --project demo-palsum "npm run test:rules && npm run test:auth-emulator"
      - uses: actions/upload-artifact@v4
        with:
          name: palsum-preview-build
          path: dist
