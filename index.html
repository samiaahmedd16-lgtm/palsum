>r.querySelector('[name="selfPerson"]').checked);if(selfIndex<0)return toast('Choose Me next to your name to track your share.');if(people.every(p=>p.paid===0))return toast('Add at least one non-zero contribution.');const h={id:editingId||uid(),place,date,emoji:'☕',people,selfIndex};if(editingId){state.hangouts=state.hangouts.map(x=>x.id===editingId?h:x)}else{state.hangouts.push(h)}if(convertingPlanId)state.plans=state.plans.filter(p=>p.id!==convertingPlanId);selected=h.id;view='hangouts'}const wasPlan=modal==='plan';persist();closeModal();root();toast(wasPlan?'Plan saved!':'Saved. The group chat can relax.')}function closeModal(){modal=null;document.getElementById('modalroot').innerHTML=''}
function shareUrl(h){let obj={place:h.place,date:h.date,people:h.people};let encoded=btoa(Array.from(new TextEncoder().encode(JSON.stringify(obj)),x=>String.fromCharCode(x)).join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return location.href.split('#')[0]+'#share='+encoded}function openDetails(id,silent=false){const h=state.hangouts.find(x=>x.id===id);if(!h){selected=null;return}selected=id;const settlements=calc(h),each=total(h)/h.people.length;document.getElementById('modalroot').innerHTML=`<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true" tabindex="-1"><div class="modal-head"><div><h2>${esc(h.place)}</h2><p>${dateText(h.date)} · ${h.people.length} friends</p></div><button aria-label="Close dialog" class="close" data-action="closeDetails">×</button></div><div class="summary"><div class="between"><span>Total hangout bill</span><strong>${money(total(h))}</strong></div><div class="between"><span>Your share · ${esc(h.people[myIndex(h)].name)}</span><strong>${money(mySpent(h))}</strong></div></div><h3>Who contributed what</h3>${h.people.map(p=>`<div class="split-row"><span>${esc(p.name)}</span><strong>${money(p.paid)}</strong></div>`).join('')}<h3 class="section-spacer">Suggested settlements</h3>${settlements.length?settlements.map(s=>`<div class="split-row"><span><strong>${esc(s.from)}</strong> pays <strong>${esc(s.to)}</strong></span><strong>${money(s.amount)}</strong></div>`).join(''):'<p class="muted">All settled! Everyone has contributed their share.</p>'}<p class="explain">Suggested payments reduce outstanding balances; they are not recorded as completed transfers.</p><div class="modal-actions" style="flex-wrap:wrap"><button class="btn danger small" data-action="deleteHangout">Delete</button><button class="btn secondary small" data-action="editHangout">Edit</button><button class="btn" data-action="shareHangout">↗ Copy share link</button></div><p class="explain" style="margin-top:15px">Share links contain a read-only snapshot (including friends' names). They require the app to be hosted online to open on another device, and won't update after edits.</p></div></div>`;prepareModal()}function showShared(){try{let raw=location.hash.slice(7).replace(/-/g,'+').replace(/_/g,'/');let bytes=Uint8Array.from(atob(raw),c=>c.charCodeAt(0));let h=JSON.parse(new TextDecoder().decode(bytes));if(!h||!Array.isArray(h.people)||h.people.length<1||h.people.length>100||h.people.some(p=>typeof p.name!=='string'||!Number.isFinite(Number(p.paid))||Number(p.paid)<0))throw Error('Invalid link');const ts=calc(h);document.getElementById('app').innerHTML=`<main style="max-width:700px;margin:6vh auto;padding:20px"><div class="logo"><span class="logo-icon">⇄</span>pal<span>sum.</span></div><div class="panel"><span class="tag">Shared hangout · Read-only snapshot</span><h1 style="margin-top:16px">${esc(h.place)}</h1><p class="muted">${dateText(h.date)}</p><div class="summary"><div class="between"><span>Total bill</span><strong>${money(total(h))}</strong></div><div class="between"><span>Each person's share</span><strong>${money(total(h)/h.people.length)}</strong></div></div><h3>Contributions</h3>${h.people.map(p=>`<div class="split-row"><span>${esc(p.name)}</span><strong>${money(p.paid)}</strong></div>`).join('')}<h3 class="section-spacer">Who pays whom</h3>${ts.length?ts.map(s=>`<div class="split-row"><span>${esc(s.from)} → ${esc(s.to)}</span><strong>${money(s.amount)}</strong></div>`).join(''):'<p class="muted">Everything is balanced.</p>'}<p class="explain section-spacer">This is a snapshot taken when the link was generated; subsequent changes are not reflected here.</p><button class="btn" data-action="home">Go to Palsum</button></div></main>`}catch(e){document.getElementById('app').innerHTML=`<main style="max-width:550px;margin:10vh auto;padding:20px"><h1>Couldn't open this hangout</h1><p>The link may be invalid or incomplete.</p><button class="btn" data-action="home">Go to Palsum</button></main>`}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='palsum-backup.json';a.click();URL.revokeObjectURL(url)}function doImport(file){if(!file)return;file.text().then(s=>{const obj=JSON.parse(s);if(!validData(obj))throw Error();if(!confirm('Replace your existing Palsum data with this backup?'))return;state=obj;persist();document.body.dataset.theme=state.theme;root();toast('Backup imported.')}).catch(()=>toast('This is not a valid Palsum backup.'))}

function prepareModal(){const dialog=document.querySelector('.modal');if(!dialog)return;dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');const heading=dialog.querySelector('h2');if(heading){heading.id='dialog-title';dialog.setAttribute('aria-labelledby',heading.id)}(dialog.querySelector('input')||dialog.querySelector('button')||dialog).focus()}
function openBudget(){selected=null;document.getElementById('modalroot').innerHTML=`<div class="overlay" data-overlay><div class="modal" style="max-width:420px"><div class="modal-head"><div><h2>Make room for good times</h2><p>Your monthly hangout budget.</p></div><button class="close" aria-label="Close dialog" data-action="close">×</button></div><form id="budgetform"><div class="field"><label for="budgetamount">Monthly budget (Rs.)</label><input id="budgetamount" type="number" min="0.01" max="1000000000" step="0.01" required value="${state.budget}"></div><div class="modal-actions"><button class="btn secondary" type="button" data-action="close">Cancel</button><button class="btn" type="submit">Save budget</button></div></form></div></div>`;document.getElementById('budgetform').addEventListener('submit',e=>{e.preventDefault();const value=Number(document.getElementById('budgetamount').value);if(!Number.isFinite(value)||value<=0||value>1e9)return;state.budget=value;persist();closeModal();root();toast('Fun money updated.')});prepareModal()}
document.addEventListener('keydown',e=>{const dialog=document.querySelector('.modal');if(!dialog)return;if(e.key==='Escape'){selected=null;closeModal();return}if(e.key==='Tab'){const fields=[...dialog.querySelectorAll('button,input,select,[tabindex="0"]')].filter(el=>!el.disabled&&!el.hidden);const first=fields[0],last=fields.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

let installEvent=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});
window.addEventListener('appinstalled',()=>{installEvent=null;toast('Palsum was installed!')});
async function installPalsum(){if(installEvent){const event=installEvent;installEvent=null;await event.prompt();return;}document.getElementById('modalroot').innerHTML=`<div class="overlay" data-overlay><div class="modal" style="max-width:440px"><div class="modal-head"><div><h2>Take Palsum with you</h2><p>Install the app from your browser.</p></div><button aria-label="Close dialog" class="close" data-action="close">×</button></div><div class="notice"><strong>On iPhone:</strong> open this link in Safari, tap Share, then Add to Home Screen.<br><br><strong>On Android:</strong> open in Chrome and choose Install app or Add to Home screen from the browser menu.<br><br><strong>On desktop:</strong> use your browser's Install app option in the address bar or menu.<br><br>Installation needs a published HTTPS link. It won't work from a downloaded HTML file.</div><div class="modal-actions"><button class="btn secondary" data-action="close">Got it</button></div></div></div>`;prepareModal();}
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
document.addEventListener('click',async e=>{let el=e.target.closest('[data-view],[data-action],[data-open],button[data-theme]');if(!el){if(e.target.matches('[data-overlay]')){selected=null;closeModal()}return}if(el.dataset.view){selected=null;view=el.dataset.view;hangoutPeriod=el.dataset.period==='month'?'month':'all';searchTerm='';root();return}if(el.dataset.theme){state.theme=el.dataset.theme;document.body.dataset.theme=state.theme;persist();root();return}if(el.dataset.open){openDetails(el.dataset.open);return}let act=el.dataset.action;if(!act)return;if(act==='filterHangouts'){hangoutPeriod=el.dataset.period==='month'?'month':'all';root();return}if(act==='installApp'){installPalsum()}if(act==='newHangout'){selected=null;openForm('hangout')}if(act==='newPlan')openForm('plan');if(act==='addPerson')addPerson();if(act==='removePerson'){if(document.querySelectorAll('.person-line').length>1){el.closest('.person-line').remove();if(!document.querySelector('[name="selfPerson"]:checked'))document.querySelector('[name="selfPerson"]').checked=true}else toast('Keep at least one participant.')}if(act==='close'){selected=null;closeModal()}if(act==='closeDetails'){selected=null;closeModal()}if(act==='editHangout'){let h=state.hangouts.find(x=>x.id===selected);if(h)openForm('hangout',h)}if(act==='deleteHangout'){if(confirm('Delete this hangout permanently?')){state.hangouts=state.hangouts.filter(x=>x.id!==selected);selected=null;persist();root();toast('Hangout deleted.')}}if(act==='shareHangout'){let h=state.hangouts.find(x=>x.id===selected);if(!h)return;let u=shareUrl(h);try{await navigator.clipboard.writeText(u);toast('Share link copied!')}catch{prompt('Copy this share link:',u)}}if(act==='removePlan'){if(confirm('Delete this future plan?')){state.plans=state.plans.filter(x=>x.id!==el.dataset.id);persist();root()}}if(act==='convertPlan'){let p=state.plans.find(x=>x.id===el.dataset.id);if(p){selected=null;openForm('hangout',{planId:p.id,place:p.place,date:p.date,people:[{name:'You',paid:0},...(p.friends||'').split(',').map(name=>name.trim()).filter(name=>name&&name.toLowerCase()!=='you').map(name=>({name,paid:0})),{name:'',paid:0}]})}}if(act==='editBudget')openBudget();if(act==='export')exportData();if(act==='import')document.getElementById('importfile')?.click();if(act==='home'){history.replaceState(null,'',location.href.split('#')[0]);shareMode=false;selected=null;root()}});document.addEventListener('input',e=>{if(e.target.id==='search'){searchTerm=e.target.value;document.querySelector('.items').innerHTML=hangoutCards()}if(e.target.matches('.pname')){e.target.closest('.person-line').querySelector('[name="selfPerson"]').setAttribute('aria-label','This is me: '+(e.target.value||'Friend'))}});document.addEventListener('change',e=>{if(e.target.id==='importfile')doImport(e.target.files?.[0])});window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#share='))showShared();else{selected=null;root()}});if(location.hash.startsWith('#share='))showShared();else root();
</script></body></html>
